<style>
/* Layout: a stores counter. Top bar with role picker, tab strip, one working column. A document opens as a sheet that shows the company's own paper form. */
:root{

}

}

  --accent:#4FC2A4; --on-accent:#05221A; --accent-soft:#1B3830;
  --ok:#6FD39A; --ok-bg:#16301F; --warn:#F0C25A; --warn-bg:#35290D; --bad:#F29088; --bad-bg:#3A1917; --info:#8DB8F0; --info-bg:#172B47;

td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;max-width:100%}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(780px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding:20px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet-head .no{font-family:var(--f-mono);font-size:1.05rem;font-weight:500}

.x{background:none;border:1px solid var(--line);border-radius:6px;width:40px;height:40px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.flow{display:flex;gap:0;list-style:none;margin:0;padding:0}
.flow li{flex:1;min-width:0;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-right:6px}
.flow li::before{content:"";height:6px;border-radius:3px;background:var(--line)}
.flow li.done::before{background:var(--accent)}
.flow li.now::before{background:var(--warn)}
.flow li.now,.flow li.done{color:var(--ink);font-weight:600}
.banner{padding:10px 14px;border-radius:6px;font-size:.92rem}

.hist b{font-weight:600}
.hist small{display:block}
.actions{display:flex;flex-direction:column;gap:12px;border:1px solid var(--accent);border-radius:8px;padding:16px;background:var(--accent-soft)}
.actions h3{color:var(--ink)}
.actions .btns{display:flex;gap:10px;flex-wrap:wrap}
.actions table th,.actions table td{border-bottom-color:var(--line)}
.actions input{background:var(--surface)}
.formbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.82rem;font-weight:600;letter-spacing:.03em}
.field input,.field select,.field textarea,.cell input,.actions .iq{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:42px;width:100%;min-width:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.cell>span{display:none;font-size:.74rem;color:var(--muted)}
.line .hint{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin-top:-4px}
.line .rm{height:42px;width:42px;padding:0}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:calc(100% - 32px);font-size:.92rem;box-shadow:var(--shadow)}

@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .main{grid-column:1/-1;order:3}
  .linehead{display:none}
  .line{grid-template-columns:1fr 1fr}
  .cell>span{display:block}
  .line .w,.line .rm{grid-column:1/-1}
  .line .rm{width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:in .18s ease-out}
  @keyframes in{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}

<script>
(function(){

var COMPANY='Inspire Engineering (PVT) Ltd', REG='PV00229792';
var ROLES={

  dn:{label:'Delivery Note',short:'DN',tab:'Delivery Notes',docNo:'PUR/F/04',issue:'Issue 01, Date of Issue 2025.09.01',start:564,creators:['store']},
  grn:{label:'Goods Received Note',short:'GRN',tab:'Goods Received',docNo:'',issue:'',start:1,creators:['store']}
};
var STATUS={
  pending_auth:{t:'Awaiting authorization',c:'warn'}, approved:{t:'Authorized',c:'info'}, issued:{t:'Issued',c:'ok'},
  posted:{t:'Posted to stock',c:'ok'}, dispatched:{t:'Out for delivery',c:'info'}, delivered:{t:'Delivered',c:'ok'}, rejected:{t:'Rejected',c:'bad'}
};
var CLOSED={issued:1,posted:1,delivered:1,rejected:1};
var FLOW={
  mrn:{steps:['Requested','Authorized','Issued'],at:{pending_auth:1,approved:2,issued:3}},
  grn:{steps:['Received','Authorized','Posted'],at:{pending_auth:1,posted:3}},
  dn:{steps:['Prepared','Authorized','Dispatched','Delivered'],at:{pending_auth:1,approved:2,dispatched:3,delivered:4}}
};
var COLS={
  mrn:[['name','Name of Materials','text',1],['unit','Units','text',0],['qty','BOQ Qty.','number',0],['reqDate','Required Date','date',0],['remarks','Remarks','text',1]],
  dn:[['name','Item Description','text',1],['unit','Unit','text',0],['qty','Quantity','number',0],['remarks','Remarks','text',1]],
  grn:[['name','Item Description','text',1],['unit','Unit','text',0],['ordered','Ordered','number',0],['received','Received','number',0],['note','Condition note','text',1]]
};
var TPL={
  mrn:'minmax(0,2.4fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1.6fr) 42px',
  dn:'minmax(0,2.8fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.8fr) 42px',
  grn:'minmax(0,2.4fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.6fr) 42px'
};

var db=null, dlApi=null, canWrite=true, ready=false, local=false;
var docs=[], stock=[];
var role='requester', tab='overview', filter='all';
var sel=null, shownKey='', form=null, busy=false;

try{ var r0=localStorage.getItem('stores-desk-role'); if(r0&&ROLES[r0]) role=r0; }catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s){return document.querySelector(s);}
function dateObj(v){ return new Date(String(v).length<=10?v+'T00:00:00':v); }
function fmtDate(v){ if(!v) return '–'; var d=dateObj(v); return isNaN(d)?esc(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function fmtShort(v){ if(!v) return ''; var d=dateObj(v); return isNaN(d)?esc(v):d.toLocaleDateString('en-GB'); }
function fmtTime(v){ return new Date(v).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function nf(n){return Number(n).toLocaleString('en-GB');}
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){t.hidden=true;},4200); }
function pill(s){ var x=STATUS[s]||{t:s,c:'info'}; return '<span class="pill '+x.c+'">'+esc(x.t)+'</span>'; }
function byNew(a,b){return (b.created||'')<(a.created||'')?-1:1;}
function isoDate(a){ var d=new Date(); d.setDate(d.getDate()+a); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function iso(daysAgo,h){ var d=new Date(); d.setDate(d.getDate()-daysAgo); d.setHours(h,15,0,0); return d.toISOString(); }
function label(d){ return TYPES[d.type].short+' '+d.no; }
function stockFor(text){ var t=String(text||'').trim().toLowerCase(); if(!t) return null; return stock.find(function(s){return s.name.toLowerCase()===t||s.code.toLowerCase()===t;})||null; }

/* ---------- permissions ---------- */
function actionsFor(d){
  var out=[], R={id:'reject',label:'Reject',kind:'danger'};
  if(d.status==='pending_auth'&&role==='authorizer') out.push({id:'approve',label:d.type==='grn'?'Authorize and post to stock':'Authorize',kind:'primary'},R);
  if(d.type==='mrn'&&d.status==='approved'&&role==='store') out.push({id:'issue',label:'Issue materials',kind:'primary'});
  if(d.type==='dn'&&d.status==='approved'&&role==='store') out.push({id:'dispatch',label:'Dispatch goods',kind:'primary'});
  if(d.type==='dn'&&d.status==='dispatched'&&role==='store') out.push({id:'deliver',label:'Mark delivered',kind:'primary'});
  return canWrite?out:[];
}

/* ---------- data layer ---------- */
function persistLocal(){ try{ localStorage.setItem('stores-desk-local-v2',JSON.stringify({docs:docs,stock:stock})); }catch(e){} }
async function putDoc(d){
  if(db){ await db.doc('docs/'+d.id).set(d); }
  else{ var i=docs.findIndex(function(x){return x.id===d.id;}); if(i<0) docs.push(d); else docs[i]=d; persistLocal(); }
}
async function putStock(s){
  if(db){ await db.doc('stock/'+s.code).set(s); }
  else{ var i=stock.findIndex(function(x){return x.code===s.code;}); if(i<0) stock.push(s); else stock[i]=s; persistLocal(); }
}

    {code:'CBL-2.5',name:'PVC copper cable 2.5 mm²',unit:'m',qty:2400,reorder:1000},
    {code:'CBL-4',name:'PVC copper cable 4 mm²',unit:'m',qty:1200,reorder:500},
    {code:'CBL-6',name:'PVC copper cable 6 mm²',unit:'m',qty:300,reorder:400},
    {code:'CBL-ARM16',name:'Armoured cable 4C x 16 mm²',unit:'m',qty:420,reorder:200},
    {code:'MCB-C16',name:'MCB 1P 16 A',unit:'nos',qty:72,reorder:30},
    {code:'MCB-C32',name:'MCB 1P 32 A',unit:'nos',qty:18,reorder:20},
    {code:'MCCB-100',name:'MCCB 3P 100 A',unit:'nos',qty:6,reorder:3},

async function loadSample(){
  if(busy) return; busy=true;
  try{
    var s=seedData();
    for(var i=0;i<s.stock.length;i++) await putStock(s.stock[i]);
    for(var j=0;j<s.docs.length;j++) await putDoc(s.docs[j]);
    if(!db) render();
    toast('Sample stock and documents loaded.');
  }catch(e){ toast('Could not load the sample data.'); }
  busy=false;
}
async function initData(){
  var c=window.claude, user=null;
  try{ if(c&&c.use){ db=await c.use('db'); user=await c.use('user'); dlApi=await c.use('downloads'); } }catch(e){ db=null; }
  try{ if(user&&user.can){ var w=user.can('data.write'); if(w===false) canWrite=false; } }catch(e){}
  if(db){
    var n=0;
    var got=function(){ n++; if(n>=2){ ready=true; } render(); refreshSheet(); };
    db.collection('docs').onSnapshot(function(s){ docs=s.docs.map(function(x){var o=x.data(); o.id=x.id; return o;}); got(); },function(){ got(); });
    db.collection('stock').onSnapshot(function(s){ stock=s.docs.map(function(x){return x.data();}); got(); },function(){ got(); });
  } else {
    local=true;
    try{ var raw=JSON.parse(localStorage.getItem('stores-desk-local-v2')||'null'); if(raw){docs=raw.docs||[];stock=raw.stock||[];} }catch(e){}
    if(!docs.length&&!stock.length){ var s=seedData(); docs=s.docs; stock=s.stock; }
    ready=true; render();
  }
}

}
function detailHTML(d){
  var acts=actionsFor(d);
  var h='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(label(d))+'">'+
    '<div class="sheet-head"><div><span class="no">'+esc(label(d))+'</span><h2>'+esc(TYPES[d.type].label)+'</h2><div style="margin-top:8px">'+pill(d.status)+'</div></div><button class="x" data-close="1" aria-label="Close">×</button></div>'+flowHTML(d);
  if(acts.length) h+=actionBox(d,acts);
  else if(!CLOSED[d.status]){
    var who=d.status==='pending_auth'?'Authorizer':(d.status==='approved'||d.status==='dispatched')?'Store Keeper':'';
    if(who) h+='<div class="banner warn">Waiting for the '+who+'. Switch the role at the top to act on it.</div>';
  }
  h+='<div class="scroll">'+paperHTML(d,8)+'</div>';
  if(dlApi) h+='<div class="formbar"><small>Printable copy in the same layout as your paper form.</small><button class="btn" data-download="1">Download form to print</button></div>';
  h+='<div><h3 style="margin-bottom:10px">History</h3><ul class="hist">'+d.history.slice().reverse().map(function(e){
      return '<li><b>'+esc(e.action)+'</b><small>'+esc(e.by)+' · '+esc(e.role)+' · '+fmtDate(e.at)+' '+fmtTime(e.at)+'</small>'+(e.note?'<div>'+esc(e.note)+'</div>':'')+'</li>';}).join('')+'</ul></div>';
  return h+'</div>';
}
function showOverlay(html){ var o=$('#overlay'); o.innerHTML=html; o.hidden=false; document.body.style.overflow='hidden'; }
function closeOverlay(){ var o=$('#overlay'); o.hidden=true; o.innerHTML=''; sel=null; form=null; shownKey=''; document.body.style.overflow=''; }
function keyOf(d){ return d.status+'|'+d.history.length+'|'+role; }
function openDetail(id){ var d=docs.find(function(x){return x.id===id;}); if(!d) return; sel=id; form=null; shownKey=keyOf(d); showOverlay(detailHTML(d)); }
function refreshSheet(){
  if(!sel||form) return;
  var d=docs.find(function(x){return x.id===sel;}); if(!d){ closeOverlay(); return; }
  var k=keyOf(d); if(k!==shownKey){ shownKey=k; showOverlay(detailHTML(d)); }
}

async function perform(act){
  if(busy) return;
  var d=docs.find(function(x){return x.id===sel;}); if(!d) return;
  var noteEl=$('#note'), note=noteEl?noteEl.value.trim():'', err=$('#act-err'), actor=ROLES[role], today=isoDate(0);
  var c=JSON.parse(JSON.stringify(d)), action='', changes=[], i;
  if(act==='reject'){
    if(!note){ err.textContent='Add a short reason so the requester knows what to fix.'; return; }
    c.status='rejected'; action='Rejected';
  } else if(act==='approve'){
    c.authorizedBy=actor.name; c.authorizedDate=today;
    if(d.type==='grn'){ c.status='posted'; action='Authorized and posted to stock'; changes=d.lines.map(function(l){return {code:l.code,delta:l.received};}); }
    else { c.status='approved'; action='Authorized'; }
  } else if(act==='issue'){
    var total=0;
    for(i=0;i<c.lines.length;i++){
      var el=$('#iq-'+i), v=Math.max(0,+(el?el.value:0)||0);
      if(v>c.lines[i].qty){ err.textContent='You cannot issue more than was requested for '+c.lines[i].name+'.'; return; }
      c.lines[i].issued=v; total+=v;
      if(c.lines[i].code&&v>0) changes.push({code:c.lines[i].code,delta:-v});
    }
    if(!total){ err.textContent='Enter a quantity to issue for at least one item.'; return; }
    c.gtn=$('#gtn').value.trim(); c.invNote=$('#invn').value.trim(); c.status='issued'; action='Issued materials';
    note=[c.gtn&&('GTN '+c.gtn),c.invNote&&('Inventory note '+c.invNote)].filter(Boolean).join(', ');
  } else if(act==='dispatch'){
    c.status='dispatched'; action='Dispatched';
    if(!d.againstMrn) changes=d.lines.map(function(l){return {code:l.code,delta:-l.qty};});
  } else if(act==='deliver'){
    var rv=$('#recv').value.trim(); if(!rv){ err.textContent='Enter the name of the person who received the goods.'; return; }
    c.status='delivered'; c.receivedBy=rv; c.receivedDate=today; action='Delivered, received by '+rv;
  }
  var agg={}; changes.forEach(function(ch){ if(ch.code) agg[ch.code]=(agg[ch.code]||0)+ch.delta; });
  var codes=Object.keys(agg);
  for(i=0;i<codes.length;i++){
    var s=stock.find(function(x){return x.code===codes[i];});
    if(!s){ err.textContent='Item '+codes[i]+' is not in the stock list.'; return; }
    if(s.qty+agg[codes[i]]<0){ err.textContent='Not enough '+s.name+' in stock: '+nf(s.qty)+' '+s.unit+' on hand.'; return; }
  }
  busy=true;
  try{
    c.history.push({at:new Date().toISOString(),by:actor.name,role:actor.label,action:action,note:note});
    await putDoc(c);
    for(var j=0;j<codes.length;j++){
      var cur=stock.find(function(x){return x.code===codes[j];});
      await putStock(Object.assign({},cur,{qty:cur.qty+agg[codes[j]]}));
    }
    toast(label(c)+': '+action.toLowerCase()+'.');
    if(local) render();
    shownKey=keyOf(c); showOverlay(detailHTML(c));
  }catch(e){ var er=$('#act-err'); if(er) er.textContent='Could not save. Check your connection and try again.'; }
  busy=false;
}

/* ---------- forms ---------- */
function newLine(t){ return {name:'',code:'',unit:'',qty:'',reqDate:isoDate(3),remarks:'',ordered:'',received:'',note:''}; }
function nextNo(t){
  var n=0, any=false;
  docs.forEach(function(d){ if(d.type===t){ var v=d.num!=null?d.num:parseInt(d.no,10); if(!isNaN(v)){ n=Math.max(n,v); any=true; } } });
  var num=any?n+1:TYPES[t].start;
  return {num:num,no:String(num),id:t+'-'+num};
}
function openForm(t){
  if(t==='stock') form={type:'stock',f:{code:'',name:'',unit:'',qty:'',reorder:''},lines:[],err:''};
  else form={type:t,f:{site:'',requestedBy:role==='requester'?ROLES.requester.name:'',refDate:isoDate(0),deliveredTo:'',deliveredDate:isoDate(0),deliveredBy:'',againstMrn:'',supplier:'',poRef:'',deliveryRef:'',receivedDate:isoDate(0)},lines:[newLine(t)],err:''};
  sel=null; showOverlay(formHTML());
}
function fld(id,labelText,val,type,extra){ return '<div class="field"><label for="f-'+id+'">'+labelText+'</label><input id="f-'+id+'" data-f="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'" autocomplete="off" '+(extra||'')+'></div>'; }
function hintFor(l){ var s=l.code?stock.find(function(x){return x.code===l.code;}):null; return s?'In stock: '+nf(s.qty)+' '+esc(s.unit):(l.name?'Not in the stock list. It can still be requested.':''); }
function formHTML(){
  var fm=form, t=fm.type, F=fm.f, h='';
  if(t==='stock'){
    h='<div class="grid2">'+fld('code','Item code',F.code,'text','placeholder="e.g. MCB-C20"')+fld('name','Item name',F.name)+fld('unit','Unit',F.unit,'text','placeholder="m, nos, pcs"')+fld('qty','Opening quantity',F.qty,'number','min="0" inputmode="numeric"')+fld('reorder','Reorder level',F.reorder,'number','min="0" inputmode="numeric"')+'</div>';
    return '<div class="sheet" role="dialog" aria-modal="true" aria-label="Add stock item"><div class="sheet-head"><div><h2>Add stock item</h2></div><button class="x" data-close="1" aria-label="Close">×</button></div>'+h+'<p class="err" id="form-err">'+esc(fm.err)+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-submit="1">Save item</button><button class="btn" data-close="1">Cancel</button></div></div>';
  }
  var sites=[]; docs.forEach(function(d){ if(d.site&&sites.indexOf(d.site)<0) sites.push(d.site); });
  var dl='<datalist id="mats">'+stock.map(function(s){return '<option value="'+esc(s.name)+'">'+esc(s.code)+'</option>';}).join('')+'</datalist><datalist id="sites">'+sites.map(function(s){return '<option value="'+esc(s)+'"></option>';}).join('')+'</datalist>';
  if(t==='mrn') h='<div class="grid2">'+fld('site','Site Name',F.site,'text','list="sites"')+fld('requestedBy','Requested By (Name)',F.requestedBy)+fld('refDate','Ref. Date',F.refDate,'date')+'</div>';
  if(t==='dn') h='<div class="grid2">'+fld('deliveredTo','Delivered To',F.deliveredTo,'text','list="sites"')+fld('deliveredDate','Delivered Date',F.deliveredDate,'date')+fld('deliveredBy','Delivered By',F.deliveredBy,'text','placeholder="Driver and vehicle"')+fld('againstMrn','Against MRN no. (optional)',F.againstMrn,'text','inputmode="numeric"')+'</div>';
  if(t==='grn') h='<div class="grid2">'+fld('supplier','Supplier',F.supplier)+fld('poRef','PO reference',F.poRef)+fld('deliveryRef','Supplier delivery or invoice no.',F.deliveryRef)+fld('receivedDate','Received date',F.receivedDate,'date')+'</div>';
  var cols=COLS[t];
  var lines='<div class="lines" style="--tpl:'+TPL[t]+'"><span class="lbl">Items</span><div class="linehead">'+cols.map(function(c){return '<span>'+c[1]+'</span>';}).join('')+'<span></span></div>'+fm.lines.map(function(l,i){
    return '<div class="line">'+cols.map(function(c){
      var attrs=' data-l="'+i+'" data-k="'+c[0]+'" value="'+esc(l[c[0]])+'" aria-label="'+esc(c[1])+'"'+(c[0]==='name'?' list="mats" autocomplete="off"':'')+(c[2]==='number'?' min="0" inputmode="numeric"':'');
      return '<label class="cell'+(c[3]?' w':'')+'"><span>'+c[1]+'</span><input type="'+c[2]+'"'+attrs+'></label>';
    }).join('')+(fm.lines.length>1?'<button class="btn rm" data-rm="'+i+'" aria-label="Remove item">×</button>':'<span></span>')+'<div class="hint" data-hint="'+i+'">'+hintFor(l)+'</div></div>';
  }).join('')+'<div><button class="btn" data-addline="1">Add another item</button></div></div>';
  var title=t==='mrn'?'New Material Requisition Note':t==='grn'?'New Goods Received Note':'New Delivery Note';
  var nn=nextNo(t), note='This will be '+TYPES[t].short+' '+nn.no+'. '+(t==='mrn'?(role==='authorizer'?'You are the Authorizer, so it is authorized as you submit it.':'It goes to the Authorizer first.'):'It goes to the Authorizer for approval.');
  return '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="sheet-head"><div><h2>'+title+'</h2><small>'+note+'</small></div><button class="x" data-close="1" aria-label="Close">×</button></div>'+dl+h+lines+
    '<p class="err" id="form-err">'+esc(fm.err)+'</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-submit="1">Submit</button><button class="btn" data-close="1">Cancel</button></div></div>';
}
function rerenderForm(){ var sc=$('#overlay .sheet'), top=sc?sc.scrollTop:0; showOverlay(formHTML()); var s2=$('#overlay .sheet'); if(s2) s2.scrollTop=top; }
async function submitForm(){
  if(busy||!form) return;
  var fm=form, t=fm.type, F=fm.f;
  function fail(m){ fm.err=m; var e=$('#form-err'); if(e) e.textContent=m; }
  if(t==='stock'){
    var code=F.code.trim().toUpperCase().replace(/[^A-Z0-9_.-]/g,'-');
    if(!code||!F.name.trim()||!F.unit.trim()) return fail('Enter a code, a name and a unit.');
    if(stock.some(function(s){return s.code===code;})) return fail('That item code already exists.');
    busy=true;
    try{ await putStock({code:code,name:F.name.trim(),unit:F.unit.trim(),qty:Math.max(0,+F.qty||0),reorder:Math.max(0,+F.reorder||0)}); closeOverlay(); if(local) render(); toast('Stock item added.'); }catch(e){ fail('Could not save. Try again.'); }
    busy=false; return;
  }
  var req={mrn:['site','requestedBy','refDate'],dn:['deliveredTo','deliveredDate','deliveredBy'],grn:['supplier','poRef','receivedDate']}[t];
  for(var i=0;i<req.length;i++) if(!String(F[req[i]]).trim()) return fail('Fill in all the details above the items.');
  var qk=t==='grn'?'received':'qty';
  var filled=fm.lines.filter(function(l){return l.name.trim();});
  if(!filled.length) return fail('Add at least one item.');
  var bad=null, lines=filled.map(function(l){
    var s=stockFor(l.name), o={name:s?s.name:l.name.trim(),unit:(l.unit||'').trim()||(s?s.unit:'')};
    if(s) o.code=s.code;
    if(t==='mrn'){ o.qty=+l.qty||0; o.reqDate=l.reqDate; o.remarks=l.remarks.trim(); }
    if(t==='dn'){ o.qty=+l.qty||0; o.remarks=l.remarks.trim(); }
    if(t==='grn'){ o.ordered=+l.ordered||0; o.received=+l.received||0; o.note=l.note.trim(); }
    if(!(o[qk]>0)||!o.unit) bad=o.name;
    return o;
  });
  if(bad) return fail('Check "'+bad+'": it needs a unit and a quantity above zero.');
  if((t==='dn'||t==='grn')&&lines.some(function(l){return !l.code;})&&t==='grn') return fail('Goods received must be items from the stock list, so stock can be updated. Add new items on the Stock tab first.');
  var actor=ROLES[role], nn=nextNo(t), now=new Date().toISOString(), today=isoDate(0);
  var d={id:t+'-'+nn.num,type:t,no:nn.no,num:nn.num,created:now,lines:lines,history:[]};
  if(t==='mrn'){
    Object.assign(d,{site:F.site.trim(),requestedBy:F.requestedBy.trim(),refDate:F.refDate,status:'pending_auth'});
    d.history.push({at:now,by:actor.name,role:actor.label,action:'Requested',note:''});
    if(role==='authorizer'){ d.status='approved'; d.authorizedBy=actor.name; d.authorizedDate=today; d.history.push({at:now,by:actor.name,role:actor.label,action:'Authorized',note:''}); }
  } else if(t==='dn'){
    Object.assign(d,{deliveredTo:F.deliveredTo.trim(),deliveredDate:F.deliveredDate,deliveredBy:F.deliveredBy.trim(),againstMrn:F.againstMrn.trim(),issuedBy:actor.name,status:'pending_auth'});
    d.history.push({at:now,by:actor.name,role:actor.label,action:'Prepared',note:''});
  } else {
    Object.assign(d,{supplier:F.supplier.trim(),poRef:F.poRef.trim(),deliveryRef:F.deliveryRef.trim(),receivedDate:F.receivedDate,receivedBy:actor.name,status:'pending_auth'});
    d.history.push({at:now,by:actor.name,role:actor.label,action:'Received, sent for authorization',note:''});
  }
  busy=true;
  try{ await putDoc(d); closeOverlay(); tab=t; filter='all'; render(); toast(label(d)+' submitted.'); }catch(e){ fail('Could not save. Check your connection and try again.'); }
  busy=false;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='overlay'){ closeOverlay(); return; }
  var el=e.target.closest('[data-tab],[data-open],[data-new],[data-close],[data-filter],[data-do],[data-addline],[data-rm],[data-submit],[data-seed],[data-download]');
  if(!el) return;
  var D=el.dataset;
  if(D.tab){ tab=D.tab; filter='all'; render(); }
  else if(D.open) openDetail(D.open);
  else if(D.new) openForm(D.new);
  else if(D.close) closeOverlay();
  else if(D.filter){ filter=D.filter; render(); }
  else if(D.do) perform(D.do);
  else if(D.addline){ form.lines.push(newLine(form.type)); rerenderForm(); }
  else if(D.rm!==undefined){ form.lines.splice(+D.rm,1); rerenderForm(); }
  else if(D.submit) submitForm();
  else if(D.seed) loadSample();
  else if(D.download!==undefined) downloadForm();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='role'||!form) return;
  if(t.dataset.f) form.f[t.dataset.f]=t.value;
  else if(t.dataset.l!==undefined){
    var i=+t.dataset.l, l=form.lines[i], k=t.dataset.k; l[k]=t.value;
    if(k==='name'){
      var s=stockFor(t.value); l.code=s?s.code:'';
      if(s&&!l.unit){ l.unit=s.unit; var u=$('#overlay [data-l="'+i+'"][data-k="unit"]'); if(u) u.value=s.unit; }
      var hEl=$('#overlay [data-hint="'+i+'"]'); if(hEl) hEl.innerHTML=hintFor(l);
    }
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='role'){
    role=e.target.value; try{ localStorage.setItem('stores-desk-role',role); }catch(x){}
    render(); if(sel) refreshSheet();
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('#overlay').hidden) closeOverlay(); });

render();
initData();
})();
</script>
